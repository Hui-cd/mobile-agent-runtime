name: MobileAgentIOS
options:
  bundleIdPrefix: ai.mobileagent
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  MobileAgent:
    type: application
    platform: iOS
    sources:
      - path: MobileAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.mobileagent.ios
        PRODUCT_NAME: Mobile Agent
        INFOPLIST_FILE: MobileAgent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []

